{% extends "base.html" %}{% block titulo %}Finalizar pedido - Cupcakes{% endblock %}{% block conteudo %}
<h1>Finalizar pedido</h1><p>Informe os dados para registrar seu pedido de demonstração.</p><form class="formulario" method="post"><label for="nome">Nome completo</label><input id="nome" name="nome" maxlength="100" required autocomplete="name"><label for="email">E-mail</label><input id="email" name="email" type="email" maxlength="150" required autocomplete="email"><label for="endereco">Endereço de entrega</label><textarea id="endereco" name="endereco" maxlength="250" required autocomplete="street-address"></textarea><button class="botao" type="submit">Confirmar pedido</button></form>{% endblock %}
